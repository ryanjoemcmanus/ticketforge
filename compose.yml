services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketforge
      POSTGRES_USER: ticketforge
      POSTGRES_PASSWORD: ticketforge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["ticketforge-postgres:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticketforge
      DB_USERNAME: ticketforge
      DB_PASSWORD: ticketforge
      JWT_SECRET: local-development-secret-change-before-production
      EXPOSE_DEVELOPMENT_TOKENS: "true"
      DEMO_DATA: "true"
      DEMO_PASSWORD: "DemoPass123!"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ticketforge-postgres:
