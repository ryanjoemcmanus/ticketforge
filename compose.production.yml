services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketforge
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ticketforge"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ticketforge-production-data:/var/lib/postgresql/data
    networks: [backend]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ticketforge
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    stop_grace_period: 30s
networks:
  backend:
volumes:
  ticketforge-production-data:
