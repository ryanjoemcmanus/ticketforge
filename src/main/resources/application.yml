spring:
  application:
    name: ticketforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketforge}
    username: ${DB_USERNAME:ticketforge}
    password: ${DB_PASSWORD:ticketforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
ticketforge:
  app-url: ${APP_URL:http://localhost:8080}
  demo:
    enabled: ${DEMO_DATA:false}
    password: ${DEMO_PASSWORD:DemoPass123!}
  notifications:
    provider: ${NOTIFICATION_PROVIDER:log}
    from: ${MAIL_FROM:noreply@ticketforge.local}
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${PAYMENT_CURRENCY:usd}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  auth:
    expose-development-tokens: ${EXPOSE_DEVELOPMENT_TOKENS:false}
  jwt:
    issuer: ticketforge-api
    secret: ${JWT_SECRET:change-me-in-production-change-me-now-32-bytes}
    ttl: PT1H
  holds:
    duration: PT10M
    cleanup-delay-ms: 30000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%-5level service=ticketforge trace=%X{traceId:-} logger=%logger{36} msg="%msg"%n'
